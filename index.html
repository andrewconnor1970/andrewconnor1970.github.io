<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>Tiamat.au | Andrew Connor</title>
 
<meta
name="description"
content="The future home of Andrew Connor's stories, worlds, creative systems, and human-AI collaborations."
>
 
<style>
:root {
color-scheme: dark;
--background: #07111f;
--panel: #0d1c30;
--text: #f5f7fa;
--muted: #c7d0dc;
--accent: #79c7ff;
--border: #34516f;
}
 
* {
box-sizing: border-box;
}
 
body {
min-height: 100vh;
margin: 0;
display: grid;
place-items: center;
padding: 24px;
background:
radial-gradient(circle at top, #18324f 0%, var(--background) 55%);
color: var(--text);
font-family:
"Segoe UI",
Arial,
sans-serif;
line-height: 1.6;
}
 
main {
width: min(760px, 100%);
padding: clamp(32px, 6vw, 64px);
border: 1px solid var(--border);
border-radius: 20px;
background: rgba(13, 28, 48, 0.94);
box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
text-align: center;
}
 
.eyebrow {
margin: 0 0 12px;
color: var(--accent);
font-size: 0.85rem;
font-weight: 700;
letter-spacing: 0.16em;
text-transform: uppercase;
}
 
h1 {
margin: 0;
font-size: clamp(2.5rem, 9vw, 5.5rem);
line-height: 1;
letter-spacing: -0.04em;
}
 
.tagline {
margin: 24px auto 0;
max-width: 580px;
color: var(--muted);
font-size: clamp(1rem, 2.5vw, 1.25rem);
}
 
.status {
display: inline-block;
margin-top: 32px;
padding: 10px 18px;
border: 1px solid var(--accent);
border-radius: 999px;
color: var(--text);
font-weight: 650;
}
 
footer {
margin-top: 40px;
color: var(--muted);
font-size: 0.9rem;
}
</style>
</head>
 
<body>
<main>
<p class="eyebrow">A new home is taking shape</p>
 
<h1>Tiamat</h1>
 
<p class="tagline">
Stories, worlds, creative systems, and collaborations between
human imagination and artificial intelligence.
</p>
 
<p class="status">Website under construction</p>
 
<footer>
Created by Andrew Connor, with Else.
</footer>
</main>
</body>
</html>
