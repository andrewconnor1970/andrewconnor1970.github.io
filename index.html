<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
 
<title>Tiamat.au | Andrew Connor</title>
 
<meta
name="description"
content="The home of Andrew Connor's stories, worlds, creative systems, and human-AI collaborations."
>
 
<style>
* {
box-sizing: border-box;
}
 
html,
body {
min-height: 100%;
}
 
body {
margin: 0;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 32px;
background:
radial-gradient(circle at top, #244568 0%, #07111f 55%, #030812 100%);
color: #ffffff;
font-family: "Segoe UI", Arial, sans-serif;
}
 
.panel {
width: 100%;
max-width: 780px;
padding: 64px 48px;
border: 2px solid #4d769b;
border-radius: 24px;
background-color: #0d1c30;
box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
text-align: center;
}
 
.eyebrow {
margin: 0 0 18px;
color: #82cdff;
font-size: 14px;
font-weight: 700;
letter-spacing: 3px;
text-transform: uppercase;
}
 
h1 {
margin: 0;
color: #ffffff;
font-size: clamp(64px, 12vw, 104px);
font-weight: 700;
line-height: 1;
letter-spacing: -4px;
}
 
.tagline {
max-width: 600px;
margin: 30px auto 0;
color: #dce8f3;
font-size: 21px;
line-height: 1.65;
}
 
.status {
display: inline-block;
margin: 36px 0 0;
padding: 12px 22px;
border: 2px solid #82cdff;
border-radius: 999px;
color: #ffffff;
font-size: 16px;
font-weight: 700;
}
 
footer {
margin-top: 46px;
color: #c5d4e2;
font-size: 15px;
}
 
@media (max-width: 600px) {
body {
padding: 18px;
}
 
.panel {
padding: 44px 24px;
}
 
h1 {
letter-spacing: -2px;
}
 
.tagline {
font-size: 18px;
}
}
</style>
</head>
 
<body>
<main class="panel">
<p class="eyebrow">A new home is taking shape</p>
 
<h1>Tiamat</h1>
 
<p class="tagline">
Stories, worlds, creative systems, and collaborations between
human imagination and artificial intelligence.
</p>
 
<p class="status">Website under construction</p>
 
<footer>
Created by Andrew Connor, with Else.
</footer>
</main>
</body>
</html>
